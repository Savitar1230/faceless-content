<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><title>Rumi Longform</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root { --paper:#F2EDE4; --ink:#111; --accent:#D7263D; --line:#d8d1c4; }
* { box-sizing:border-box; }
body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.45 system-ui, sans-serif; }
header { background:var(--ink); color:var(--paper); padding:14px 20px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
header b { font-size:20px; margin-right:16px; }
nav button { background:none; color:var(--paper); border:0; padding:6px 12px; font:inherit; cursor:pointer; }
nav button.on { background:var(--accent); }
main { max-width:980px; margin:0 auto; padding:20px 16px; }
.card { background:#fff; border:1px solid var(--line); padding:14px 16px; margin-bottom:12px; }
.row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.grow { flex:1; min-width:180px; }
h3 { margin:0 0 2px; } small, .mute { color:#666; }
.pill { font-size:12px; padding:1px 8px; background:#eee; border:1px solid var(--line); }
.pill.done { background:#d9f0dc; } .pill.blocked, .pill.failed { background:#f8d7da; } .pill.waiting { background:#fdeeba; }
button.go { background:var(--accent); color:#fff; border:0; padding:7px 14px; font:inherit; cursor:pointer; }
button.alt { background:#fff; border:1px solid var(--ink); padding:6px 12px; font:inherit; cursor:pointer; }
input, textarea, select { font:inherit; padding:7px; border:1px solid #bbb; width:100%; background:#fff; }
textarea { min-height:100px; } textarea.code { font:13px/1.4 Consolas, monospace; min-height:320px; }
pre { white-space:pre-wrap; background:#f7f4ee; padding:10px; margin:8px 0; font:13px/1.4 Consolas, monospace; }
label { display:block; margin:10px 0 4px; font-weight:600; }
video { max-height:340px; max-width:100%; background:#000; }
#toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:10px 18px; max-width:90%; z-index:9; }
a.alt { background:#fff; border:1px solid var(--ink); padding:6px 12px; color:var(--ink); text-decoration:none; }
table { width:100%; border-collapse:collapse; } th, td { text-align:left; padding:4px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
</style></head>
<body>
<header><b>Rumi Longform</b><nav>
  <button data-tab="videos" class="on">Videos</button>
  <button data-tab="new">New video</button>
  <button data-tab="pages">Pages</button>
  <button data-tab="cards" id="cardsTab">Cards</button>
  <button data-tab="dashboard" hidden>Dashboard</button>
  <button data-tab="plugins" hidden>Plugins &amp; accounts</button>
  <button data-tab="team" hidden>Team</button>
</nav><small id="me" style="margin-left:auto;color:var(--paper)"></small>
<form method="post" action="/logout" style="margin:0"><button class="alt">Sign out</button></form></header>
<div id="toast" role="status" hidden></div>
<main>
  <section id="videos"></section>
  <section id="new" hidden>
    <div class="card">
      <div class="row">
        <div class="grow"><label for="template">Template</label><select id="template"></select></div>
        <div class="grow"><label for="t-save">Save these settings as</label><input id="t-save" placeholder="Template name"></div>
        <button class="alt" id="saveTemplate" style="align-self:flex-end">Save template</button>
        <button class="alt" id="delTemplate" style="align-self:flex-end">Delete template</button>
      </div>
      <label for="page">Page</label><select id="page"></select>
      <div id="picks"></div>
      <label for="topic">Topic</label><input id="topic" placeholder="Why tractors let air out of their tyres">
      <label for="facts">Facts (the script may only use these)</label><textarea id="facts"></textarea>
      <label for="sources">Source links, one per line</label><textarea id="sources" style="min-height:60px"></textarea>
      <div class="row">
        <div class="grow"><label for="format">Format</label><select id="format"><option value="short">Short (4 blocks, 40 s)</option><option value="long">Long (19 blocks, 190 s)</option></select></div>
        <div class="grow"><label for="writer">Writer</label><select id="writer"></select></div>
        <div class="grow"><label>Sizes</label><div class="row">
          <label style="margin:0;font-weight:400"><input type="checkbox" class="ratio" value="9x16" checked style="width:auto"> 9:16</label>
          <label style="margin:0;font-weight:400"><input type="checkbox" class="ratio" value="16x9" style="width:auto"> 16:9</label>
          <label style="margin:0;font-weight:400"><input type="checkbox" class="ratio" value="3x4" style="width:auto"> 3:4</label></div></div>
      </div>
      <p><button class="go" id="create">Write the script</button></p>
    </div>
    <div class="card">
      <label for="rows">Many videos: one per line, topic | facts | source links | owner</label>
      <textarea id="rows" placeholder="Why tractors let air out | Low pressure spreads the weight. | https://example.com"></textarea>
      <small>Uses the format, writer and sizes above. Anything in the Facts box is added to every line. Only the admin can set an owner.</small>
      <p><button class="go" id="createMany">Write all the scripts</button></p>
    </div>
  </section>
  <section id="pages" hidden></section>
  <section id="cards" hidden></section>
  <section id="dashboard" hidden></section>
  <section id="plugins" hidden></section>
  <section id="team" hidden></section>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api = (url, body) => fetch(url, body === undefined ? {} : {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)}).then((r) => { if (r.status === 401) location = "/login"; return r.json(); });
let editing = null, lastVideos = "", lastCards = "", plugins = [], me = {}, newKey = "", templates = [], shown = [];
const say = (msg) => { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(say.t); say.t = setTimeout(() => t.hidden = true, 5000); };
const siteOf = (name) => (plugins.find((p) => p.name === name) || {}).site;

document.querySelectorAll("nav button").forEach((b) => b.onclick = () => {
  document.querySelectorAll("nav button").forEach((x) => x.classList.toggle("on", x === b));
  document.querySelectorAll("main section").forEach((s) => s.hidden = s.id !== b.dataset.tab);
  loadAll();
});

function cardHtml(v, c, helpers = []) {
  if (me.role !== "admin" && c.person !== me.id) return `<div class="card"><small>${esc(c.title)}: ${esc(c.id)} is waiting for ${c.account ? esc(c.account) : "an account"}.</small></div>`;
  const handTo = helpers.filter((h) => h.provider === c.plugin.split("_")[0] && h.id !== c.account_id);
  const hand = handTo.length ? `<div class="row" style="margin-top:8px"><select class="grow" aria-label="Hand this card to" onchange="handCard('${v.slug}',${esc(JSON.stringify(c.id))},this.value)"><option value="">Hand this card to...</option>${
    handTo.map((h) => `<option value="${h.id}">${esc(h.owner)}: ${esc(h.label)} (${h.left} left, estimate)</option>`).join("")}</select></div>` : "";
  const head = `<div class="row"><b class="grow">${esc(c.title)}: ${esc(c.id)}</b>
    <small>${c.video ? esc(c.video) + " · " : ""}${c.account ? "Use account: " + esc(c.account) : "No account chosen"} · try ${esc(c.try)}${c.ratio ? " · " + esc(c.ratio) : ""}</small></div>`;
  if (c.held) return `<div class="card">${head}<p><span class="pill waiting">out of credits</span> ${esc(c.account)} has nothing left (estimate). This card waits until it resets, or until the owner types the real balance.</p>${hand}</div>`;
  return `<div class="card">${head}
    <pre>${esc(c.prompt)}</pre>${c.start_image ? `<a class="alt" href="/api/videos/${v.slug}/card/${encodeURIComponent(c.id)}/start">Download the start image</a><br><br>` : ""}
    <div class="row"><button class="alt" onclick="navigator.clipboard.writeText(${esc(JSON.stringify(c.prompt))}).then(() => say('Prompt copied'))">Copy prompt</button>
    ${siteOf(c.plugin) ? `<a class="alt" href="${siteOf(c.plugin)}" target="_blank" rel="noopener">Open ${esc(c.title)}</a>` : ""}
    <label class="alt" style="margin:0;font-weight:400;border:1px solid var(--ink);padding:6px 12px;cursor:pointer">Drop the finished file
      <input type="file" hidden onchange="dropFile('${v.slug}',${esc(JSON.stringify(c.id))},this.files[0])"></label></div>${hand}</div>`;
}

async function loadCards() {
  const d = await api("/api/cards");
  const now = JSON.stringify(d);
  $("#cardsTab").textContent = d.cards.length ? `Cards (${d.cards.length})` : "Cards";
  if (now === lastCards) return;  // redrawing would wipe a half-typed balance
  lastCards = now;
  const names = {flow: "Flow", muse: "Muse"};
  const box = (provider) => {
    const a = d.mine.find((x) => x.provider === provider);
    return `<div class="card"><b>Your ${names[provider]} account</b>
      <div class="row"><input class="grow" id="my-${provider}" value="${esc(a ? a.label : "")}" placeholder="Account name" aria-label="Your ${names[provider]} account name">
        <button class="alt" onclick="saveMine('${provider}',{label:$('#my-${provider}').value})">Save</button></div>
      ${a ? `<div class="row" style="margin-top:8px"><small class="grow">${a.left} of ${a.limit} left this ${provider === "flow" ? "day" : "week"} (estimate)</small>
        <input style="width:150px" id="left-${provider}" type="number" min="0" placeholder="Real balance" aria-label="Real ${names[provider]} balance"><button class="alt" onclick="saveMine('${provider}',{left:$('#left-${provider}').value})">Save balance</button>
        <label style="margin:0;font-weight:400"><input type="checkbox" style="width:auto" ${a.helps ? "checked" : ""} onchange="saveMine('${provider}',{helps:this.checked})"> I can take handed cards</label></div>` : ""}</div>`;
  };
  $("#cards").innerHTML = `<div class="card mute">You do not need a Flow or Muse account to use this app. If you have one, add it here. Run each card in your own browser, then drop the file in. Nobody else ever needs your login.</div>` +
    (d.cards.length ? d.cards.map((c) => cardHtml({slug: c.slug}, c, d.helpers)).join("") : `<div class="card">No cards for you right now.</div>`) + box("flow") + box("muse");
}
async function saveMine(provider, body) {
  const r = await api(`/api/mine/${provider}`, body);
  say(r.error || "Saved."); lastCards = ""; loadCards();
}
async function handCard(slug, id, account) {
  if (!account) return;
  const r = await api(`/api/videos/${slug}/card/${encodeURIComponent(id)}/hand`, {account: +account});
  say(r.error || "Card handed over."); lastCards = ""; loadCards();
}

async function loadDashboard() {
  if (me.role !== "admin") return;
  const d = await api("/api/dashboard");
  const s = d.states, set = d.settings;
  const stat = (label, n) => `<div class="card grow"><small>${label}</small><br><b style="font-size:26px">${n}</b></div>`;
  const field = (k, label) => `<div class="grow"><label for="s-${k}">${label}</label><input id="s-${k}" type="number" min="0" step="any" value="${set[k]}"></div>`;
  const table = (heads, rows) => `<table><tr>${heads.map((h) => `<th>${h}</th>`).join("")}</tr>${rows.map((r) => `<tr>${r.map((x) => `<td>${esc(x)}</td>`).join("")}</tr>`).join("")}</table>`;
  $("#dashboard").innerHTML = (d.warnings.length ? `<div class="card"><b>Needs you</b>${d.warnings.map((w) => `<p style="margin:6px 0">${esc(w)}</p>`).join("")}</div>` : "") +
    `<div class="row">${stat("Jobs today", d.jobs_today)}${stat("In the queue", (s.queued || 0) + (s.running || 0))}${stat("Waiting for a person", s.waiting || 0)}${stat("Failed", s.failed || 0)}${stat("Cards open", d.cards_open)}${stat("Cards out of credits", d.cards_held)}</div>
    <h3 style="margin:18px 0 8px">Usage per account (estimate)</h3><div class="card">${table(["Account", "Tool", "Owner", "Used", "Left", "Limit"], d.accounts.map((a) => [a.label, a.provider, a.owner, a.used, a.left, a.limit]))}</div>
    <h3 style="margin:18px 0 8px">Usage per person today (estimate)</h3><div class="card">${table(["Person", "Role", "Jobs", "Credits"], d.people.map((x) => [x.name, x.role, x.jobs_today, x.credits_today]))}</div>
    ${d.failed.length ? `<h3 style="margin:18px 0 8px">Failed</h3><div class="card">${table(["Video", "Why"], d.failed.map((f) => [f.title, f.message]))}</div>` : ""}
    <h3 style="margin:18px 0 8px">Costs and rules</h3><div class="card"><div class="row">${field("flow_image", "Flow image cost")}${field("muse_video", "Muse video cost")}${field("muse_voice", "Muse voice cost")}${field("flow_limit", "Flow credits a day")}${field("muse_limit", "Muse videos a week")}</div>
      <div class="row">${field("keep_days", "Keep finished videos, days (0 = always)")}${field("ollama_from", "Ollama from hour")}${field("ollama_to", "Ollama to hour")}</div>
      <p><button class="go" onclick="saveSettings()">Save</button></p></div>
    ${d.cleanup.length ? `<div class="card"><b>${d.cleanup.length} videos are past your keep rule</b><p>${d.cleanup.map((c) => esc(c.title)).join(", ")}</p><button class="alt" onclick='cleanOld(${esc(JSON.stringify(d.cleanup.map((c) => c.slug)))}, this)'>Delete these videos</button></div>` : ""}
    <h3 style="margin:18px 0 8px">Audit log, newest first</h3><div class="card">${table(["When", "Who", "What", "Video", "Account", "Credits"], d.audit.map((a) => [new Date(a.at * 1000).toLocaleString(), a.who, a.action, a.job, a.account, a.credits ?? ""]))}</div>`;
}
async function saveSettings() {
  const body = Object.fromEntries([...document.querySelectorAll('[id^="s-"]')].map((i) => [i.id.slice(2), i.value]));
  const r = await api("/api/settings", body);
  say(r.error || "Saved."); loadDashboard(); lastCards = ""; loadCards();
}
async function cleanOld(videos, btn) {
  if (!btn.dataset.sure) { btn.dataset.sure = 1; btn.textContent = "Click again to delete"; return; }
  const r = await api("/api/cleanup", {videos});
  say(r.error || `${r.deleted} deleted.`); loadDashboard(); loadVideos();
}

async function loadVideos() {
  if (editing) return;
  const [list, who] = await Promise.all([api("/api/videos"), api("/api/me")]);
  me = who;
  const now = JSON.stringify([list, who]) + plugins.length;
  if (now === lastVideos) return;  // redrawing would reset a playing video and swallow clicks
  lastVideos = now;
  const isBusy = (v) => ["queued", "running"].includes(v.status.state);
  const ready = list.some((v) => !v.approved && v.blocks && !isBusy(v));
  const bar = (who.queue_paused ? `<div class="card"><b>The queue is paused.</b> Work already running finishes, nothing new starts.</div>` : "") +
    (who.role === "admin" || ready ? `<div class="row" style="margin-bottom:12px">
      ${who.role === "admin" ? `<button class="alt" onclick="pauseQueue(${!who.queue_paused})">${who.queue_paused ? "Resume the queue" : "Pause the queue"}</button>` : ""}
      ${ready ? `<button class="go" onclick="approveAll()">Approve all ready</button>` : ""}</div>` : "");
  $("#videos").innerHTML = bar + (list.length ? list.map((v) => {
    const st = v.status.state || "waiting";
    const busy = isBusy(v);
    const again = `<button class="alt" onclick="runVideo('${v.slug}')">Run again</button>`;
    const need = busy ? "" : !v.approved ? (v.blocks ? `<button class="go" onclick="approve('${v.slug}')">Approve and make</button>` : again) : st === "done" ? "" : again;
    const hold = st === "done" ? "" : `<button class="alt" onclick="pauseVideo('${v.slug}', ${!v.paused})">${v.paused ? "Resume" : "Pause"}</button>`;
    return `<div class="card"><div class="row"><div class="grow"><h3>${esc(v.title || v.slug)}</h3>
      <span class="pill ${esc(st)}">${esc(st)}</span>${v.paused ? ` <span class="pill waiting">paused</span>` : ""} <small>${esc(v.status.stage || "")} · ${esc(v.format)}</small></div>
      ${need}${hold}<button class="alt" onclick="edit('${v.slug}')">Edit script</button>${st === "running" ? "" : `<button class="alt" onclick="removeVideo('${v.slug}', this)">Delete</button>`}</div>
      ${v.status.message ? `<pre>${esc(v.status.message)}</pre>` : ""}
      ${v.cards.map((c) => cardHtml(v, c)).join("")}
      <div class="row">${v.outputs.filter((f) => f.endsWith(".mp4")).map((f) => `<div><small>${esc(f)}</small><br><video controls preload="metadata" src="/files/${v.slug}/${esc(f)}"></video><br><a class="alt" href="/files/${v.slug}/${esc(f)}?download=1">Download</a></div>`).join("")}</div></div>`;
  }).join("") : `<div class="card">No videos yet. Start one under New video.</div>`);
}

async function edit(slug) {
  editing = slug;
  const s = await api(`/api/videos/${slug}/spec`);
  $("#videos").innerHTML = `<div class="card"><h3>${esc(s.title)}</h3>
    <label for="spec">Script and storyboard</label><textarea id="spec" class="code">${esc(JSON.stringify(s, null, 1))}</textarea>
    <p class="row"><button class="go" onclick="saveSpec('${slug}')">Save</button><button class="alt" onclick="editing=null;loadVideos()">Cancel</button></p></div>`;
}
async function saveSpec(slug) {
  let body; try { body = JSON.parse($("#spec").value); } catch (e) { alert("That is not valid: " + e.message); return; }
  await api(`/api/videos/${slug}/spec`, body); editing = null; loadVideos();
}
const approve = (slug) => api(`/api/videos/${slug}/approve`, {}).then((r) => { say(r.error || "Approved. It is in the queue."); loadVideos(); });
const runVideo = (slug) => api(`/api/videos/${slug}/run`, {}).then((r) => { say(r.error || "Added to the queue."); loadVideos(); });
const pauseVideo = (slug, paused) => api(`/api/videos/${slug}/pause`, {paused}).then(() => { say(paused ? "Paused." : "Resumed."); loadVideos(); });
const pauseQueue = (paused) => api("/api/queue/pause", {paused}).then(() => { say(paused ? "Queue paused." : "Queue resumed."); loadVideos(); });
const approveAll = () => api("/api/approve-all", {}).then((r) => { say(r.error || `${r.approved} approved. Scripts that fail the check were left for you to fix.`); loadVideos(); });
async function removeVideo(slug, btn) {
  if (!btn.dataset.sure) { btn.dataset.sure = 1; btn.textContent = "Click again to delete"; return; }  // browser pop-ups can be blocked
  const r = await api(`/api/videos/${slug}/delete`, {});
  say(r.error || "Deleted."); loadVideos();
}
async function dropFile(slug, id, file) {
  const fd = new FormData(); fd.append("file", file);
  const r = await fetch(`/api/videos/${slug}/card/${id}`, {method:"POST", body:fd}).then((x) => x.json());
  say(r.error || "File received."); loadVideos(); lastCards = ""; loadCards();
}

async function loadPlugins() {
  const list = plugins = await api("/api/plugins");
  const owners = me.role === "admin" ? await api("/api/team") : [];
  $("#writer").innerHTML = list.filter((p) => p.kind === "text").map((p) => `<option value="${p.name}">${esc(p.title)}</option>`).join("");
  $("#writer").value = "ollama_writer";  // free and local comes first
  const kinds = {text:"Writing", voice:"Voice", image:"Images", video:"Video", render:"Render"};
  $("#plugins").innerHTML = `<div class="card mute">Connect account opens the site so you can sign in there, and saves a name here so job cards show which account to use. The app never holds passwords and never switches accounts to get more free credits.</div>` +
    Object.entries(kinds).map(([k, name]) => `<h3 style="margin:18px 0 8px">${name}</h3>` + list.filter((p) => p.kind === k).map((p) => `
    <div class="card"><div class="row"><div class="grow"><b>${esc(p.title)}</b><br><small>${esc(p.description)} ${esc(p.free)}.</small></div></div>
    ${p.card ? `<div style="margin-top:8px">${p.accounts.list.map((a) => `<div class="row"><label style="margin:0;font-weight:400" class="grow">
      <input type="radio" name="a-${p.name}" style="width:auto" ${p.accounts.active === a.label ? "checked" : ""} onchange="acct('${p.name}',{active:${esc(JSON.stringify(a.label))}})"> ${esc(a.label)} <small>${esc(a.owner)}</small></label>
      ${p.site ? `<a class="alt" href="${p.site}" target="_blank" rel="noopener">Open site</a>` : ""}<button class="alt" onclick="acct('${p.name}',{remove:${esc(JSON.stringify(a.label))}})">Remove</button></div>`).join("")}
      <div class="row" style="margin-top:8px"><input class="grow" id="l-${p.name}" placeholder="Account name" aria-label="Account name"><select class="grow" id="o-${p.name}" aria-label="Who owns it">${owners.map((o) => `<option value="${o.id}">${esc(o.name)}</option>`).join("")}</select>
      <button class="alt" onclick="addAcct('${p.name}')">Connect account</button></div></div>` : ""}</div>`).join("")).join("");
}
const acct = (name, body) => api(`/api/accounts/${name}`, body).then(async (r) => { await loadPlugins(); return r; });
async function addAcct(name) {
  const p = plugins.find((x) => x.name === name);
  const label = $("#l-" + name).value.trim() || `${p.title} ${p.accounts.list.length + 1}`;
  if (p.site) window.open(p.site, "_blank", "noopener");
  const r = await acct(name, {label, person: +$("#o-" + name).value});
  say(r.error || `${label} saved. Sign in on the page that opened. If nothing opened, press Open site.`);
}

const tick = (p, k, label) => `<label style="margin:0;font-weight:400"><input type="checkbox" style="width:auto" ${p[k] ? "checked" : ""} onchange="teamAct(${p.id},{${k}:this.checked})"> ${label}</label>`;
function personHtml(p) {
  const key = p.has_key ? (p.expires ? `key ends ${new Date(p.expires * 1000).toLocaleDateString()}` : "key never ends") : "no live key";
  const head = `<div class="grow"><b>${esc(p.name)}</b> <span class="pill">${esc(p.role)}</span>${p.status === "paused" ? ` <span class="pill waiting">paused</span>` : ""}<br><small>${key}</small></div>`;
  if (p.role === "admin") return `<div class="card"><div class="row">${head}</div></div>`;
  return `<div class="card"><div class="row">${head}${p.role === "teammate" ? tick(p, "flow", "Flow") + tick(p, "muse", "Muse") : ""}
    <button class="alt" onclick="teamAct(${p.id},{new_key:true})">New key</button>
    <button class="alt" onclick="teamAct(${p.id},{revoke:true})">Revoke key</button>
    <button class="alt" onclick="teamAct(${p.id},{status:'${p.status === "paused" ? "active" : "paused"}'})">${p.status === "paused" ? "Resume" : "Pause"}</button>
    <button class="alt" onclick="removePerson(${p.id}, this)">Remove</button></div></div>`;
}
async function loadTeam() {
  if (me.role !== "admin") return;
  const list = await api("/api/team");
  $("#team").innerHTML = (newKey ? `<div class="card"><b>Copy this key now. It will not be shown again.</b><pre>${esc(newKey)}</pre>
      <div class="row"><button class="go" onclick="navigator.clipboard.writeText(newKey).then(() => say('Key copied'))">Copy key</button><button class="alt" onclick="newKey='';loadTeam()">Done</button></div></div>` : "") +
    `<div class="card mute">A key lets someone use this app. It does not sign them in to Flow or Muse, and they never see a password.</div>
    <div class="card"><div class="row"><input class="grow" id="t-name" placeholder="Teammate's name" aria-label="Teammate's name">
      <label style="margin:0;font-weight:400"><input type="checkbox" id="t-flow" style="width:auto"> Flow</label>
      <label style="margin:0;font-weight:400"><input type="checkbox" id="t-muse" style="width:auto"> Muse</label>
      <button class="go" onclick="addPerson({name: $('#t-name').value, flow: $('#t-flow').checked, muse: $('#t-muse').checked})">Add and make key</button>
      ${list.some((p) => p.role === "assistant") ? "" : `<button class="alt" onclick="addPerson({name: 'Assistant', assistant: true})">Make assistant key</button>`}</div></div>` +
    list.map(personHtml).join("");
}
async function addPerson(body) {
  const r = await api("/api/team", body);
  if (r.key) newKey = r.key;
  say(r.error || "Added."); loadTeam();
}
async function teamAct(id, body) {
  const r = await api(`/api/team/${id}`, body);
  if (r.key) newKey = r.key;
  say(r.error || "Saved."); loadTeam();
}
function removePerson(id, btn) {
  if (!btn.dataset.sure) { btn.dataset.sure = 1; btn.textContent = "Click again to remove"; return; }
  teamAct(id, {status: "removed"});
}

$("#create").onclick = async () => {
  const topic = $("#topic").value.trim(), facts = $("#facts").value.trim();
  if (!topic || !facts) { say("Add a topic and the facts first."); return; }
  if (!document.querySelector(".ratio:checked")) { say("Tick at least one size."); return; }
  const r = await api("/api/videos", {topic, facts, page: $("#page").value, sources: $("#sources").value.split("\n").map((s) => s.trim()).filter(Boolean), ...settings()});
  if (r.error) { say(r.error); return; }
  $("#topic").value = ""; suggestTopics();  // that topic is used now
  document.querySelector('nav button[data-tab="videos"]').click();
};
const settings = () => ({format: $("#format").value, writer: $("#writer").value, ratios: [...document.querySelectorAll(".ratio:checked")].map((c) => c.value)});

$("#createMany").onclick = async () => {
  if (!document.querySelector(".ratio:checked")) { say("Tick at least one size."); return; }
  const r = await api("/api/batch", {rows: $("#rows").value, facts: $("#facts").value, ...settings()});
  if (r.error) { say(r.error); return; }
  $("#rows").value = "";
  say(`${r.slugs.length} videos are in the queue.`);
  document.querySelector('nav button[data-tab="videos"]').click();
};

async function suggestTopics(more) {
  if (!more) shown = [];
  if (!$("#page").value) { $("#picks").innerHTML = ""; return; }
  const list = await api(`/api/pages/${$("#page").value}/suggest?skip=${shown.join(",")}`);
  shown = list.length ? shown.concat(list.map((t) => t.id)) : [];  // after the last one, Suggest more starts over
  $("#picks").innerHTML = `<div style="margin-top:8px">` + (list.length ? list.map((t) => `<div class="row" style="margin-bottom:8px"><div class="grow"><b>${esc(t.topic)}</b><br><small>${esc(t.category)}: ${esc(t.why)}</small></div>
    <button class="alt" onclick="pickTopic(${esc(JSON.stringify(t.topic))})">Pick</button></div>`).join("") : `<p>No more topics for this page right now.</p>`) +
    `<button class="alt" onclick="suggestTopics(true)">Suggest more</button></div>`;
}
$("#page").onchange = () => suggestTopics();
function pickTopic(topic) {
  $("#topic").value = topic; $("#format").value = "long";
  document.querySelectorAll(".ratio").forEach((c) => c.checked = c.value === "16x9");
  say("Topic picked. Add the facts, then press Write the script.");
}

function pageHtml(x, voices) {
  const admin = me.role === "admin", off = x.locked ? "disabled" : "";
  return `<div class="card"><div class="row">
    <div class="grow"><label for="pn-${x.id}">Page${admin ? ` <small>${esc(x.owner)}</small>` : ""}</label><input id="pn-${x.id}" value="${esc(x.name)}" ${admin ? "" : "disabled"}></div>
    <div class="grow"><label for="pi-${x.id}">Identity</label><input id="pi-${x.id}" value="${esc(x.identity)}" placeholder="One single person" ${off}></div>
    <div class="grow"><label for="pv-${x.id}">Voice</label><select id="pv-${x.id}" ${off}><option value="">Choose</option>${voices.map((v) => `<option ${v === x.voice ? "selected" : ""}>${v}</option>`).join("")}</select></div></div>
    <div class="row" style="margin-top:8px"><small class="grow">${x.locked ? "Locked. " : ""}${x.used} topics used</small>
    ${x.locked && !admin ? "" : `<button class="alt" onclick="savePage(${x.id},{})">Save</button>`}
    ${x.locked ? (admin ? `<button class="alt" onclick="savePage(${x.id},{locked:false})">Unlock</button>` : "") : `<button class="go" onclick="savePage(${x.id},{locked:true})">Lock identity</button>`}</div></div>`;
}
async function loadPages() {
  const keep = $("#page").value;
  const [d, people] = await Promise.all([api("/api/pages"), me.role === "admin" ? api("/api/team") : []]);
  $("#page").innerHTML = `<option value="">No page</option>` + d.pages.filter((x) => x.locked).map((x) => `<option value="${x.id}">${esc(x.name)}${me.role === "teammate" ? "" : ` (${esc(x.owner)})`}</option>`).join("");
  $("#page").value = d.pages.some((x) => x.locked && String(x.id) === keep) ? keep : "";
  if ($("#page").value !== keep) suggestTopics();
  $("#pages").innerHTML = `<div class="card mute">Each page has one identity and one voice, used for every video on that page. Choose them, then lock them. Only the admin can unlock. ${d.unused} unused topics left.</div>` +
    (d.pages.length ? d.pages.map((x) => pageHtml(x, d.voices)).join("") : `<div class="card">No pages yet. The admin adds them here.</div>`) +
    (me.role === "admin" ? `<div class="card"><div class="row"><input class="grow" id="p-name" placeholder="Page name" aria-label="Page name">
      <select class="grow" id="p-person" aria-label="Whose page">${people.filter((x) => x.role !== "assistant").map((x) => `<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select>
      <button class="go" onclick="addPage()">Add page</button></div></div>
      <div class="card"><label for="p-topics">New topics, one per line: category | topic | why it is interesting</label><textarea id="p-topics"></textarea>
      <p><button class="go" onclick="addTopics()">Add topics</button></p></div>` : "");
}
async function savePage(id, body) {
  const v = (name) => $(`#p${name}-${id}`).value;
  const r = await api(`/api/pages/${id}`, {identity: v("i"), voice: v("v"), ...(me.role === "admin" ? {name: v("n")} : {}), ...body});
  say(r.error || "Saved."); loadPages();
}
async function addPage() {
  const r = await api("/api/pages", {name: $("#p-name").value, person: +$("#p-person").value});
  say(r.error || "Page added."); loadPages();
}
async function addTopics() {
  const r = await api("/api/topics", {rows: $("#p-topics").value});
  say(r.error || `${r.added} added, ${r.skipped} skipped.`); loadPages();
}

async function loadTemplates() {
  const keep = $("#template").value;
  templates = await api("/api/templates");
  $("#template").innerHTML = `<option value="">None</option>` + templates.map((t) => `<option value="${t.id}">${esc(t.name)}</option>`).join("");
  $("#template").value = templates.some((t) => String(t.id) === keep) ? keep : "";
}
$("#template").onchange = () => {
  const t = templates.find((x) => String(x.id) === $("#template").value);
  if (!t) return;
  $("#format").value = t.format; $("#writer").value = t.writer; $("#facts").value = t.facts;
  document.querySelectorAll(".ratio").forEach((c) => c.checked = t.ratios.split(",").includes(c.value));
  say(`${t.name} loaded.`);
};
$("#saveTemplate").onclick = async () => {
  const r = await api("/api/templates", {name: $("#t-save").value, facts: $("#facts").value, ...settings()});
  say(r.error || "Template saved.");
  if (!r.error) $("#t-save").value = "";
  loadTemplates();
};
$("#delTemplate").onclick = async () => {
  if (!$("#template").value) { say("Pick a template first."); return; }
  await api(`/api/templates/${$("#template").value}/delete`, {});
  say("Template deleted."); loadTemplates();
};

async function loadAll() {
  me = await api("/api/me");
  $("#me").textContent = me.name;
  document.querySelectorAll('[data-tab="plugins"], [data-tab="team"], [data-tab="dashboard"]').forEach((b) => b.hidden = me.role !== "admin");
  await loadPlugins(); loadTemplates(); loadPages(); loadVideos(); loadTeam(); loadCards(); loadDashboard();
}
loadAll();
setInterval(() => { loadVideos(); loadCards(); }, 4000);
</script>
</body></html>
